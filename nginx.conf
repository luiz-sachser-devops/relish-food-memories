# Upstream nginx (relish-platform.eu) proxies /foodmemories/ to this server.
# Example upstream rule:
#   location /foodmemories/ { proxy_pass https://192.92.147.83/; }
#
# This means relish-platform.eu/foodmemories/api/... becomes
# 192.92.147.83/api/... on this server.

server {
  listen 8080;
  server_name _;

  return 301 https://$host:443$request_uri;
}

server {
  listen 443 ssl http2;
  server_name _;

  ssl_certificate /etc/nginx/ssl/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  client_max_body_size 20M;

  root /usr/share/nginx/html;
  index index.html;

  # Proxy API requests to the backend
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  # Proxy API requests specifically from the /foodmemories subpath
  location /foodmemories/api/ {
    proxy_pass http://backend:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  # Serve uploaded files from backend
  location /uploads/ {
    proxy_pass http://backend:4000/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Serve the React frontend (also under /foodmemories/ alias for subpath access)
  location /foodmemories/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /foodmemories/index.html;
  }

  # Direct access to root (for direct IP visits or via upstream proxy)
  location / {
    try_files $uri /index.html;
  }
}

