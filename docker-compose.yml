services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
    command: sh -c "npm run seed:admin && node src/index.js"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-https://foodmemories.vps.tecnico.ulisboa.pt}
      MONGODB_URI: mongodb://mongo:27017/food-memories
      UPLOAD_ROOT: uploads
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./server/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-https://relish-platform.eu}
        PUBLIC_URL: ${PUBLIC_URL:-/foodmemories}
    depends_on:
      - backend
    ports:
      - "80:8080"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    restart: unless-stopped

volumes:
  mongo-data:
