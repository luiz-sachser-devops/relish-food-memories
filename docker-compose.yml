services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
    command: sh -c "npm run seed:admin && node src/index.js"
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      MONGODB_URI: mongodb://mongo:27017/food-memories
      UPLOAD_ROOT: uploads
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - ./server/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        REACT_APP_API_BASE_URL: http://localhost:4000
    depends_on:
      - backend
    ports:
      - "3000:8080"
    restart: unless-stopped

volumes:
  mongo-data: