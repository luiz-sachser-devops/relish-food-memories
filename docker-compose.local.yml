services:
  backend:
    environment:
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"

  frontend:
    build:
      args:
        REACT_APP_API_BASE_URL: http://localhost:4000
        PUBLIC_URL: /
    ports: !override
      - "3000:8080"
    volumes: !override
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro